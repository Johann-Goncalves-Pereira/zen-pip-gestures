name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Sync embed assets
        run: |
          rsync -a --delete chrome/ internal/assets/chrome/
          rsync -a scripts/repatch-on-update.sh scripts/install-launch-agent.sh scripts/uninstall-launch-agent.sh internal/assets/scripts/

      - name: Test
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
          go test ./...

      - name: Build darwin arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/zen-pip-install-darwin-arm64 ./cmd/install

      - name: Build darwin amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/zen-pip-install-darwin-amd64 ./cmd/install

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zen-pip-install-darwin-arm64
            dist/zen-pip-install-darwin-amd64
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
